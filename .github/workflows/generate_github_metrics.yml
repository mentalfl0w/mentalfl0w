name: GitHub lines history

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/generate_github_metrics.yml

concurrency:
  group: profile-generated-assets-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub metrics
        uses: lowlighter/metrics@366f8b9dfe3a59656c67d5dcad9950f59c9bc96d
        with:
          token: ${{ secrets.GH_TOKEN }}
          filename: profile/lines-history.svg
          base: ""
          config_timezone: Asia/Shanghai
          plugin_lines: yes
          plugin_lines_sections: repositories,history
          plugin_lines_repositories_limit: 4
          plugin_lines_history_limit: 1
